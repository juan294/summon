name: Publish to npm

# Authentication is OIDC trusted publishing, not a token (#641). npm revoked
# classic tokens in Dec 2025, stripped account management from bypass-2FA
# granular tokens in Aug 2026, and removes their direct-publish ability in
# Jan 2027 — after which a token can only *stage* a publish for human 2FA
# approval, which no unattended workflow can do.
#
# The trust relationship is registered against this repository, THIS FILENAME,
# and the `npm-publish` environment below. Renaming either silently breaks
# publishing with an opaque 401, so change one only alongside:
#
#   npm trust github summon-ws --repo juan294/summon \
#     --file release.yml --env npm-publish --allow-publish

on:
  release:
    types: [published]

permissions:
  contents: write # Required for gh release upload (SBOM attachment)
  id-token: write # Mints the OIDC token npm exchanges for publish rights

jobs:
  publish:
    # Create 'npm-publish' environment in GitHub Settings > Environments with required reviewer.
    # This name is part of the npm trust binding — see the header note.
    environment: npm-publish
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if ! grep -q "## \[$PKG_VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing entry for version $PKG_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # LTS — update in lockstep with ci.yml matrix
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        # Node 22 bundles npm 10.9, which has no OIDC support at all and fails
        # with a bare 401 that reads like a credentials problem. Trusted
        # publishing needs >= 11.5.1, so upgrade before anything touches the
        # registry and record the resolved version in the log.
        run: |
          npm install -g npm@latest
          npm --version

      - run: corepack enable
      - run: corepack prepare pnpm@10.29.2 --activate
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Generate SBOM (#566, #623)
        # Transient via npx — not a project dependency. Produces CycloneDX JSON SBOM.
        # --ignore-npm-errors: this repo is pnpm-managed, so the tool's internal
        # `npm ls` reports unmet npm-style devDeps; without this flag it exits 254
        # and aborts the job before publish. SBOM is supplementary, never a gate.
        continue-on-error: true
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.json

      - name: Attach SBOM to GitHub Release
        # Best-effort: only attach if the SBOM was actually produced; never block publish.
        if: hashFiles('sbom.json') != ''
        continue-on-error: true
        run: gh release upload "$GITHUB_REF_NAME" sbom.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Warn when no SBOM was produced
        # A silently-absent SBOM is indistinguishable from a successful one at
        # job-status level; only 1 of 15 releases actually carries one. Make the
        # absence visible without turning it into a gate.
        if: hashFiles('sbom.json') == ''
        run: echo "::warning::No sbom.json was produced; this release will ship without an SBOM."

      - name: Pack and inspect tarball
        run: |
          npm pack
          TARBALL=$(ls summon-ws-*.tgz)
          echo "Tarball: $TARBALL"
          FILE_COUNT=$(tar tzf "$TARBALL" | grep -E "package/dist/(index\.js|chunk-)" | wc -l | tr -d ' ')
          echo "Matched dist files: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "ERROR: Expected package/dist/index.js + at least one chunk-*.js in tarball (got $FILE_COUNT)" && exit 1
          fi
          if ! tar tzf "$TARBALL" | grep -q "^package/README\.md$"; then
            echo "ERROR: README.md missing from tarball" && exit 1
          fi
          if ! tar tzf "$TARBALL" | grep -q "^package/LICENSE$"; then
            echo "ERROR: LICENSE missing from tarball" && exit 1
          fi
          # Node 22 smoke (pre-publish, using local tarball)
          npm install -g "$TARBALL"
          summon --version
          summon --help

      - name: Upload tarball artifact for multi-node smoke test
        uses: actions/upload-artifact@v7
        with:
          name: summon-tarball
          path: summon-ws-*.tgz
          retention-days: 1

      - name: Attempt Ghostty install for the AppleScript E2E (#517)
        # release.yml previously ran the E2E with no Ghostty present at all, so
        # it skipped 100% of the time. Best-effort install gives it a chance to
        # actually assert something.
        continue-on-error: true
        run: brew install --cask ghostty

      - name: AppleScript E2E smoke test
        # Advisory: a hosted runner usually cannot resolve the Ghostty
        # dictionary even with the cask installed, so this records a skip
        # reason rather than pretending to pass. The blocking gate is the
        # release-evidence analyzer below.
        run: SUMMON_E2E=1 pnpm test:e2e

      # ── Release evidence gate (E2E Pro Wave A) ──────────────────────────
      # Everything above this point can be green while the release is still
      # unsafe. These three steps are what make tagging truthful, and they run
      # BEFORE publish so a failure is recoverable.
      - name: Verify candidate identity
        run: |
          TAG_SHA=$(git rev-list -n1 "$GITHUB_REF_NAME")
          echo "Tag $GITHUB_REF_NAME -> $TAG_SHA"
          echo "Workflow SHA        -> $GITHUB_SHA"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: the tag does not point at the commit being built." && exit 1
          fi

      - name: Run release probes
        run: pnpm test:release
        env:
          SUMMON_RELEASE_CANDIDATE: ${{ github.sha }}

      - name: Build evidence manifest
        if: always()
        run: |
          pnpm release:manifest \
            --out release-evidence.json \
            --environment ci-macos \
            --baseline "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo none)"
        env:
          SUMMON_RELEASE_CANDIDATE: ${{ github.sha }}

      - name: Analyze evidence (blocks the release)
        # No continue-on-error. This is the gate.
        run: pnpm analyze:release --manifest release-evidence.json --candidate "${{ github.sha }}"

      - name: Check if version already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "summon-ws@${PKG_VERSION}" version 2>/dev/null | grep -q "$PKG_VERSION"; then
            echo "::warning::Version $PKG_VERSION is already on npm; the publish step will be skipped."
            echo "PUBLISH_OUTCOME=skipped-already-published" >> "$GITHUB_ENV"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_OUTCOME=published" >> "$GITHUB_ENV"
          fi

      - name: Publish
        if: env.ALREADY_PUBLISHED != 'true'
        # No NODE_AUTH_TOKEN. Two distinct mechanisms, both riding the same OIDC
        # id-token, which an earlier comment here conflated:
        #   --provenance       attests how the tarball was built (SLSA).
        #   trusted publishing authenticates the publish itself — this is what
        #                      replaces NPM_TOKEN. npm detects the OIDC
        #                      environment and exchanges the id-token for a
        #                      short-lived publish credential.
        run: npm publish summon-ws-*.tgz --provenance --access public

      # ── Close the candidate-identity loop ───────────────────────────────
      # npm SLSA provenance binds the tarball to a git commit. Assert it is the
      # commit we actually verified: this is the check that would have caught
      # v1.8.0 being tagged against two different trees ten minutes apart.
      - name: Verify published provenance matches the candidate
        if: env.ALREADY_PUBLISHED != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # The registry needs a moment to expose a freshly-published attestation.
          for attempt in 1 2 3 4 5; do
            PROV_SHA=$(curl -sf "https://registry.npmjs.org/-/npm/v1/attestations/summon-ws@${PKG_VERSION}" \
              | node -e '
                let raw = "";
                process.stdin.on("data", (c) => (raw += c));
                process.stdin.on("end", () => {
                  try {
                    const doc = JSON.parse(raw);
                    for (const att of doc.attestations ?? []) {
                      const payload = att?.bundle?.dsseEnvelope?.payload;
                      if (!payload) continue;
                      const stmt = JSON.parse(Buffer.from(payload, "base64").toString());
                      const dep = stmt?.predicate?.buildDefinition?.resolvedDependencies?.[0];
                      if (dep?.digest?.gitCommit) { process.stdout.write(dep.digest.gitCommit); return; }
                    }
                  } catch { /* fall through to retry */ }
                });
              ') || true
            [ -n "$PROV_SHA" ] && break
            echo "Attestation not available yet (attempt $attempt); retrying..."
            sleep 15
          done

          if [ -z "$PROV_SHA" ]; then
            echo "::warning::Could not read provenance attestation; skipping identity assertion."
            exit 0
          fi
          echo "Provenance gitCommit -> $PROV_SHA"
          echo "Verified candidate   -> $GITHUB_SHA"
          if [ "$PROV_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: published artifact was built from $PROV_SHA, not the verified candidate $GITHUB_SHA." && exit 1
          fi

      - name: Attach release evidence to the GitHub Release
        if: always() && hashFiles('release-evidence.json') != ''
        continue-on-error: true
        run: gh release upload "$GITHUB_REF_NAME" release-evidence.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Validate the published tarball on Node 20.19 (minimum) and 24 (latest).
  # Node 22 is already smoke-tested inside the publish job above.
  # Runs after publish so the matrix doesn't gate the release itself.
  smoke-matrix:
    needs: publish
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: ['20.19.0', '24']
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: summon-tarball

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Global install smoke test (Node ${{ matrix.node-version }})
        run: |
          TARBALL=$(ls summon-ws-*.tgz)
          npm install -g "$TARBALL"
          summon --version
          summon --help

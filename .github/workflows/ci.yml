name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node-version-invariant checks run ONCE on the cheap Linux runner.
  # typecheck (tsc), lint (eslint) and build (tsup) produce identical results
  # across Node 20/22/24, so fanning them across the version matrix only paid
  # for redundant work. They are also platform-agnostic (no osascript/Ghostty),
  # so they run on ubuntu-latest — billed 1× versus 10× for macOS runners.
  checks:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.29.2 --activate
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  # Unit tests DO vary by Node version, so this is the only leg that fans out.
  # All unit tests mock node:child_process (osascript/execSync/execFileSync are
  # never invoked for real), and the macOS-only AppleScript E2E is gated behind
  # SUMMON_E2E (unset here) — so the suite is platform-agnostic and runs on the
  # 1×-billed Linux runner instead of the 10×-billed macOS one.
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Vite 8 supports Node 20.19+ and 22.12+. Node 24 added for forward-compat.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: corepack prepare pnpm@10.29.2 --activate
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Release-required probes (E2E Pro Wave A3). These are the checks a release
  # gates on, and unlike the macOS E2E below they genuinely execute on a hosted
  # runner: every one drives `--dry-run`, which needs no Ghostty, no GUI session
  # and no TCC grant, yet still exercises trust resolution, layered config,
  # layout planning and the whole AppleScript generator.
  #
  # A probe that cannot run FAILS here; src/release/no-skip.test.ts forbids the
  # describe.skipIf construct that made the macOS check a permanent no-op.
  release-probes:
    name: Release probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.29.2 --activate
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run release probes
        run: pnpm test:release
        env:
          SUMMON_RELEASE_CANDIDATE: ${{ github.sha }}
      # Always build the manifest, including after a probe failure — the
      # analyzer must see the failure and block, not find a missing file.
      - name: Build evidence manifest
        if: always()
        run: pnpm release:manifest --out release-evidence.json --environment ci-ubuntu
        env:
          SUMMON_RELEASE_CANDIDATE: ${{ github.sha }}
      - name: Analyze evidence
        if: always()
        run: pnpm analyze:release --manifest release-evidence.json --candidate "${{ github.sha }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence.json
          retention-days: 90

  # Advisory, NOT a required check. osacompile can only resolve Ghostty's
  # scripting dictionary on macOS, and on a hosted runner LaunchServices is not
  # populated even after `brew install --cask ghostty` (#517) — so this job
  # skips its assertion in practice. It used to be a *required* check that
  # skipped and reported green, i.e. a gate that could never fail. It now
  # records an explicit skip reason, and the real gate is `Release probes`
  # above plus the TTL-bound manual Ghostty arc.
  e2e-applescript:
    name: AppleScript syntax E2E (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.29.2 --activate
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Attempt Ghostty install (QA-S1 / #517)
        # Best-effort: cask may be unavailable or slow in CI. If it fails, the
        # test probes the dictionary itself and skips gracefully.
        continue-on-error: true
        run: brew install --cask ghostty
      - name: Run AppleScript syntax E2E tests
        # SUMMON_E2E=1 opts into CI mode. The test probes whether osacompile
        # can resolve the Ghostty dictionary at runtime and skips if not (#517).
        run: pnpm vitest run src/e2e/applescript-syntax.test.ts
        env:
          SUMMON_E2E: "1"
